<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home</title>
	<main>
  <p>This is a basic HTML test page.</p>
  <img src="images/skeletor_mirror.gif" alt="Punch">
</main>
    <style>
      :root {
        --background: #282a36;
        --current-line: #44475a;
        --foreground: #f8f8f2;
        --comment: #6272a4;
        --cyan: #8be9fd;
        --green: #50fa7b;
        --orange: #ffb86c;
        --pink: #ff79c6;
        --purple: #bd93f9;
        --red: #ff5555;
        --yellow: #f1fa8c;
      }
	  
	img {
		max-width: 100%;
		height: auto;
		border-radius: 8px;
		border: 1px solid var(--current-line);
	}

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 2rem 1.5rem;
        background: var(--background);
        color: var(--foreground);
        font-family: Helvetica, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.6;
      }

      header,
      main {
        max-width: 42rem;
        margin: 0 auto;
      }

      header {
        padding-bottom: 1rem;
        margin-bottom: 1.5rem;
        border-bottom: 1px solid var(--current-line);
      }

      h1 {
        margin: 0;
        color: var(--purple);
        font-weight: 700;
      }

      p {
        margin: 0 0 1rem;
      }

      a {
        color: var(--cyan);
      }

      a:hover {
        color: var(--pink);
      }

      ::selection {
        background: var(--current-line);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Hello, world</h1>
    </header>

    <main>
      <p>This is a basic HTML test page.</p>
    </main>
  </body>
</html>
